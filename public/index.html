<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1

    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
            return val;
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {

          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });

  })();
  </script>
  <title>Restaurant Tier List</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. The same script also
       drives the public share page, so both switch looks live. -->
  <script src="/theme.js"></script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <main class="mx-auto flex max-w-md flex-col gap-8 px-4 py-10">

    <!-- Header: the list's title and counts, with Share beside them for
         signed-in members. Guests see the title only. -->
    <header class="flex items-start justify-between gap-4">
      <div class="min-w-0">
        <h1 class="text-title" id="list-title">Restaurant Tier List</h1>
        <p class="text-small text-muted" id="list-meta" hidden></p>
      </div>
      <button class="btn-secondary flex-none" id="share-button" hidden type="button">Share</button>
    </header>

    <!-- Share panel: opens under the header when Share is tapped. Its one
         job is handing someone the link, so Copy link is the primary action
         once the link exists. -->
    <section class="card flex flex-col gap-3" id="share-panel" hidden>
      <div>
        <h2 class="text-heading">Share this list</h2>
        <p class="text-small text-muted">Anyone with the link can view this list. No account needed.</p>
      </div>
      <div class="flex flex-col gap-3" id="share-shared" hidden>
        <label class="section-label" for="share-url">Share link</label>
        <input class="field" id="share-url" readonly>
        <button class="btn-primary" id="copy-link" type="button">Copy link</button>
        <button class="btn-secondary" id="stop-sharing" type="button">Stop sharing</button>
      </div>
      <div id="share-off" hidden>
        <button class="btn-primary" id="create-link" type="button">Create link</button>
      </div>
      <p class="text-small text-muted" id="share-status" hidden></p>
    </section>

    <!-- Adding is for signed-in members; guests are read-only everywhere. -->
    <form class="flex flex-col gap-3" id="add-form" hidden>
      <label class="section-label" for="entry-name">Add a restaurant</label>
      <input class="field" id="entry-name" maxlength="80" autocomplete="off" placeholder="e.g. Noodle House 88">
      <div class="flex items-center gap-3">
        <label class="text-small text-muted" for="entry-tier">Tier</label>
        <select class="min-h-11 rounded-lg border border-line bg-surface px-3 text-body text-fg" id="entry-tier">
          <option value="S">Tier S</option>
          <option value="A">Tier A</option>
          <option value="B" selected>Tier B</option>
          <option value="C">Tier C</option>
          <option value="D">Tier D</option>
        </select>
        <button class="btn-primary flex-1" type="submit">Add</button>
      </div>
      <p class="text-small text-muted" id="form-error" hidden></p>
    </form>

    <!-- Loading shapes first, so the screen never shows the empty state
         while data is on its way. -->
    <div id="content">
      <div class="flex flex-col gap-4" data-loading>
        <div class="skeleton h-40 w-full"></div>
        <div class="skeleton h-40 w-full"></div>
      </div>
    </div>

    <p class="text-center text-small text-muted">Restaurant Tier List</p>
  </main>

  <script>
  (function () {
    'use strict';

    var TIERS = ['S', 'A', 'B', 'C', 'D'];
    // Staging previews can be opened with ?demo=1, which points the screen
    // and every API call at the seeded demo list instead of the real one.
    var demo = new URLSearchParams(location.search).get('demo') === '1';
    function api(path, options) {
      var suffix = demo ? (path.indexOf('?') === -1 ? '?demo=1' : '&demo=1') : '';
      return fetch('/api/' + path + suffix, options);
    }

    function el(id) { return document.getElementById(id); }
    function show(node) { node.hidden = false; }
    function hide(node) { node.hidden = true; }

    var state = { member: false, list: null, tiers: {} };

    // ── Loading, error and empty states ──────────────────────────────────
    function renderLoading() {
      var content = el('content');
      content.textContent = '';
      var box = document.createElement('div');
      box.className = 'flex flex-col gap-4';
      for (var i = 0; i < 2; i++) {
        var shape = document.createElement('div');
        shape.className = 'skeleton h-40 w-full';
        box.appendChild(shape);
      }
      content.appendChild(box);
    }

    function renderError() {
      var content = el('content');
      content.textContent = '';
      var box = document.createElement('div');
      box.className = 'state-error';
      var heading = document.createElement('h2');
      heading.className = 'text-heading';
      heading.textContent = 'Could not load the list';
      var note = document.createElement('p');
      note.className = 'text-body text-muted';
      note.textContent = 'Your saved list has not changed. Check your connection and try again.';
      var retry = document.createElement('button');
      retry.className = 'btn-secondary mt-2';
      retry.type = 'button';
      retry.textContent = 'Retry';
      retry.addEventListener('click', init);
      box.appendChild(heading);
      box.appendChild(note);
      box.appendChild(retry);
      content.appendChild(box);
    }

    function renderEmpty() {
      var content = el('content');
      content.textContent = '';
      var box = document.createElement('div');
      box.className = 'state-empty';
      var heading = document.createElement('h2');
      heading.className = 'text-heading';
      heading.textContent = 'No restaurants yet';
      var note = document.createElement('p');
      note.className = 'text-body text-muted';
      note.textContent = state.member
        ? 'Add the first restaurant above to start the ranking.'
        : 'The group has not added any restaurants yet.';
      box.appendChild(heading);
      box.appendChild(note);
      content.appendChild(box);
    }

    // ── The tier board ───────────────────────────────────────────────────
    function entryRow(entry) {
      var li = document.createElement('li');
      li.className = 'list-row';
      var name = document.createElement('div');
      name.className = 'min-w-0 flex-1';
      var line = document.createElement('p');
      line.className = 'text-body';
      line.textContent = entry.name;
      name.appendChild(line);
      if (entry.note) {
        var note = document.createElement('p');
        note.className = 'text-small text-muted';
        note.textContent = entry.note;
        name.appendChild(note);
      }
      li.appendChild(name);
      if (state.member) {
        var select = document.createElement('select');
        select.className = 'min-h-11 flex-none rounded-lg border border-line bg-surface px-2 text-body text-fg';
        select.setAttribute('aria-label', 'Move ' + entry.name + ' to tier');
        TIERS.forEach(function (tier) {
          var option = document.createElement('option');
          option.value = tier;
          option.textContent = 'Tier ' + tier;
          if (tier === entry.tier) option.selected = true;
          select.appendChild(option);
        });
        select.addEventListener('change', function () {
          moveEntry(entry.id, select.value);
        });
        li.appendChild(select);
      }
      return li;
    }

    function tierSection(tier, entries) {
      var section = document.createElement('section');
      var label = document.createElement('h2');
      label.className = 'section-label';
      label.textContent = 'Tier ' + tier;
      var list = document.createElement('ul');
      list.className = 'list';
      if (entries.length) {
        entries.forEach(function (entry) { list.appendChild(entryRow(entry)); });
      } else {
        var li = document.createElement('li');
        li.className = 'list-row';
        var quiet = document.createElement('span');
        quiet.className = 'text-small text-muted';
        quiet.textContent = 'Nothing here yet';
        li.appendChild(quiet);
        list.appendChild(li);
      }
      section.appendChild(label);
      section.appendChild(list);
      return section;
    }

    function renderList() {
      hide(el('list-meta'));
      if (!state.list) { renderError(); return; }
      el('list-title').textContent = state.list.title;
      if (state.list.entryCount > 0) {
        el('list-meta').textContent = state.list.entryCount
          + (state.list.entryCount === 1 ? ' restaurant' : ' restaurants')
          + ' · ' + state.list.tierCount
          + (state.list.tierCount === 1 ? ' tier' : ' tiers');
        show(el('list-meta'));
      }
      var content = el('content');
      content.textContent = '';
      if (state.list.entryCount === 0) { renderEmpty(); return; }
      TIERS.forEach(function (tier) {
        content.appendChild(tierSection(tier, state.tiers[tier] || []));
      });
    }

    // ── Data ─────────────────────────────────────────────────────────────
    function load() {
      return Promise.all([
        api('me').then(function (res) { return res.json(); }).catch(function () { return { user: null }; }),
        api('list').then(function (res) {
          if (!res.ok) throw new Error('list failed');
          return res.json();
        }),
      ]).then(function (results) {
        state.member = !!(results[0] && results[0].user);
        state.list = results[1].list;
        state.tiers = results[1].tiers || {};
        // Members rank and share; guests get the read-only board.
        if (state.member) { show(el('add-form')); show(el('share-button')); }
        renderList();
      });
    }

    function init() {
      renderLoading();
      load().catch(renderError);
    }

    function moveEntry(id, tier) {
      api('entries/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tier: tier }),
      }).then(function () { return load(); })
        .catch(function () { return load(); }); // reload puts the select back on the truth
    }

    // ── Adding ───────────────────────────────────────────────────────────
    el('add-form').addEventListener('submit', function (event) {
      event.preventDefault();
      var input = el('entry-name');
      var name = input.value.trim();
      var status = el('form-error');
      if (!name) return;
      api('entries', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, tier: el('entry-tier').value }),
      }).then(function (res) {
        if (res.ok) { input.value = ''; hide(status); return load(); }
        return res.json().then(function (body) {
          status.textContent = body.error || 'Could not add the restaurant';
          show(status);
        });
      }).catch(function () {
        status.textContent = 'Could not add the restaurant. Check your connection and try again.';
        show(status);
      });
    });

    // ── Sharing ──────────────────────────────────────────────────────────
    function shareStatus(message) {
      var status = el('share-status');
      if (!message) { hide(status); return; }
      status.textContent = message;
      show(status);
    }

    function renderShareState(share) {
      var shared = el('share-shared');
      var off = el('share-off');
      if (share && share.shared && share.slug) {
        el('share-url').value = location.origin + '/share/' + share.slug;
        show(shared);
        hide(off);
      } else {
        hide(shared);
        show(off);
      }
    }

    el('share-button').addEventListener('click', function () {
      var panel = el('share-panel');
      if (!panel.hidden) { panel.hidden = true; return; }
      panel.hidden = false;
      hide(el('share-shared'));
      hide(el('share-off'));
      shareStatus('');
      api('share').then(function (res) { return res.json(); })
        .then(renderShareState)
        .catch(function () { shareStatus('Could not load sharing. Try again.'); });
    });

    el('create-link').addEventListener('click', function () {
      shareStatus('');
      api('share', { method: 'POST' }).then(function (res) { return res.json(); })
        .then(renderShareState)
        .catch(function () { shareStatus('Could not create the link. Try again.'); });
    });

    // Clipboard writes need the gesture they are in: this runs inside the
    // tap, with a select-and-copy fallback for browsers without the API.
    el('copy-link').addEventListener('click', function () {
      var button = el('copy-link');
      var url = el('share-url').value;
      var done = function () {
        button.textContent = 'Copied';
        setTimeout(function () { button.textContent = 'Copy link'; }, 1500);
      };
      var fallback = function () {
        var area = document.createElement('textarea');
        area.value = url;
        document.body.appendChild(area);
        area.select();
        try {
          document.execCommand('copy');
          done();
        } catch (err) {
          shareStatus('Copy failed. Select the link and copy it by hand.');
        }
        document.body.removeChild(area);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, fallback);
      } else {
        fallback();
      }
    });

    el('share-url').addEventListener('focus', function () { this.select(); });

    el('stop-sharing').addEventListener('click', function () {
      shareStatus('');
      api('share', { method: 'DELETE' }).then(function (res) { return res.json(); })
        .then(renderShareState)
        .catch(function () { shareStatus('Could not stop sharing. Try again.'); });
    });

    init();
  })();
  </script>
</body>
</html>
